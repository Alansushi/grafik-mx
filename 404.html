<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0C0C0C" />
  <title>Página no encontrada | GRAFIK</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --negro:#0C0C0C; --blanco:#F0F0EE; --rojo:#D02B34; --rojo-dark:#A0202A; --plata:#B8B8B8; --wa:#25D366; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; background: radial-gradient(60% 70% at 80% 30%, rgba(208,43,52,.28), transparent 70%), var(--negro); color: var(--blanco); font-family: 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 620px; }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
    .brand svg { width: 54px; height: 54px; color: var(--blanco); }
    .brand b { font: 900 42px/0.9 'Barlow Condensed', sans-serif; letter-spacing: .2em; }
    .code { font: 900 clamp(88px, 22vw, 150px)/0.85 'Barlow Condensed', sans-serif; color: transparent; -webkit-text-stroke: 2px rgba(240,240,238,.35); }
    h1 { margin: 14px 0 12px; font: 900 clamp(34px, 7vw, 52px)/0.95 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .02em; }
    h1 em { color: var(--rojo); font-style: italic; }
    p { color: var(--plata); font-size: 17px; line-height: 1.6; max-width: 480px; }
    .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    a.btn { display: inline-flex; align-items: center; gap: 9px; min-height: 52px; padding: 0 24px; font: 600 14px 'Barlow', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--blanco); text-decoration: none; border: 1.5px solid rgba(240,240,238,.3); }
    a.btn.red { background: var(--rojo); border-color: var(--rojo-dark); }
    a.btn.wa { background: var(--wa); border-color: rgba(255,255,255,.3); color: #0C0C0C; }
    a.btn:hover, a.btn:focus-visible { outline: 2px solid var(--blanco); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 68 68" aria-hidden="true"><use href="/defs.svg#mark"/></svg>
      <b>GRAFIK</b>
    </div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Esta página <em>no existe.</em></h1>
    <p>Puede que el enlace haya cambiado. Desde el inicio puedes ver nuestros trabajos reales, los productos que imprimimos y cotizar por WhatsApp.</p>
    <div class="ctas">
      <a class="btn red" href="/">Ir al inicio</a>
      <a class="btn" href="/#servicios">Ver productos</a>
      <a class="btn wa" href="https://wa.me/525539014600?text=Hola%20GRAFIK%2C%20me%20interesa%20cotizar%20un%20trabajo%20de%20imprenta%2Fpublicidad.">Cotizar por WhatsApp</a>
    </div>
  </main>
</body>
</html>
